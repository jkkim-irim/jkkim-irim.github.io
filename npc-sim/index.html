<meta charset="utf-8">
<title>npc-sim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
:root{
  --paper:#EFF2ED; --surface:#E5EAE3; --sunk:#DAE1D8; --line:#C4CDC0;
  --ink:#111719; --ink-2:#414D4A; --ink-3:#6D7975;
  --accent:#1F6E7B; --ok:#4F7A31; --warn:#B08415; --crit:#AC3F27;
  --t-water:#3D6E88; --t-rock:#67736E; --t-void:#E8EDE6;
  --t-hill:#7F9159; --t-home:#9C7B4C; --t-river:#6EA0B4; --t-square:#A79A72;
  --t-forge:#AA5C34; --t-diner:#B5783F; --t-hall:#7A72A0;
  --t-road:#8A8A84; --t-wall:#4A423C; --t-bridge:#C08A4A; --t-tunnel:#6B6B7A;
  /* Three series, in fixed order, never cycled. Checked against this page's own surface
     in both themes: lightness band, chroma floor, CVD separation (worst adjacent pair
     ΔE 20.0 protan / 15.8 tritan light, 17.4 / 10.4 dark), normal-vision floor and
     contrast. Separate from --ok/--warn/--crit, which mean state and are not series. */
  --s1:#0A7EA0; --s2:#C08A0C; --s3:#B0357C;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0C1113; --surface:#141B1D; --sunk:#0A0F10; --line:#26312F;
    --ink:#E2E8E2; --ink-2:#A3AFAB; --ink-3:#78847F;
    --accent:#4FA3AE; --ok:#84B45B; --warn:#D6A93A; --crit:#D9694C;
    --t-water:#27506B; --t-rock:#3A4643; --t-void:#161D1F;
    --t-hill:#5D6E3E; --t-home:#7A5D36; --t-river:#3F7A91; --t-square:#7E7350;
    --t-forge:#8C4726; --t-diner:#8F5A26; --t-hall:#565080;
    --t-road:#605E58; --t-wall:#3A332E; --t-bridge:#9A6A2E; --t-tunnel:#4A4A58;
  --s1:#2691AD; --s2:#BC8A1B; --s3:#BC4E8E;
  }
}
:root[data-theme="dark"]{
  --paper:#0C1113; --surface:#141B1D; --sunk:#0A0F10; --line:#26312F;
  --ink:#E2E8E2; --ink-2:#A3AFAB; --ink-3:#78847F;
  --accent:#4FA3AE; --ok:#84B45B; --warn:#D6A93A; --crit:#D9694C;
  --t-water:#27506B; --t-rock:#3A4643; --t-void:#161D1F;
  --t-hill:#5D6E3E; --t-home:#7A5D36; --t-river:#3F7A91; --t-square:#7E7350;
  --t-forge:#8C4726; --t-diner:#8F5A26; --t-hall:#565080;
  --t-road:#605E58; --t-wall:#3A332E; --t-bridge:#9A6A2E; --t-tunnel:#4A4A58;
  --s1:#2691AD; --s2:#BC8A1B; --s3:#BC4E8E;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans KR",system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
.wrap{
  max-width:820px; margin:0 auto;
  padding:clamp(14px,3vw,28px) clamp(12px,3vw,24px) clamp(20px,4vw,40px);
}

/* ── status ───────────────────────────────────────────── */
.top{display:flex; flex-wrap:wrap; align-items:center; gap:9px 14px; margin-bottom:12px}
.badge{
  display:inline-flex; align-items:center; gap:7px; flex:none;
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11px; font-weight:500;
  letter-spacing:.09em; padding:5px 11px; border-radius:2px;
  border:1px solid var(--line); color:var(--ink-3);
}
.badge::before{content:""; width:7px; height:7px; border-radius:50%; background:currentColor}
.badge[data-state="live"]{color:var(--crit); border-color:currentColor}
.badge[data-state="live"]::before{animation:pulse 1.4s ease-in-out infinite}
.badge[data-state="wait"]{color:var(--warn); border-color:currentColor}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.badge[data-state="live"]::before{animation:none}}
.clock{
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:19px; font-weight:500;
  font-variant-numeric:tabular-nums; letter-spacing:-.01em;
}
.spacer{flex:1 1 auto; min-width:0}
.who{
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11.5px;
  color:var(--ink-3); letter-spacing:.02em;
}

/* ── the village ──────────────────────────────────────── */
#map{
  display:block; width:100%; height:auto; border-radius:3px;
  background:var(--t-void); border:1px solid var(--line);
}
.legend{
  display:flex; flex-wrap:wrap; gap:4px 13px; margin-top:11px;
  font-size:12px; color:var(--ink-2);
}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend i{width:10px; height:10px; border-radius:2px; flex:none}

/* ── who is doing what ────────────────────────────────── */
.cast{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(148px,1fr)); gap:1px;
  margin-top:14px; background:var(--line); border:1px solid var(--line);
  border-radius:3px; overflow:hidden;
}
.cast > div{background:var(--surface); padding:9px 12px 11px}
.cast b{
  display:block; font-size:13.5px; font-weight:600; letter-spacing:-.01em;
}
.cast b.me{color:var(--accent)}
.cast em{
  font-style:normal; display:block; margin-top:1px;
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11.5px; color:var(--ink-3);
}
.cast s{
  text-decoration:none; display:block; margin-top:3px;
  font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:11px;
  font-variant-numeric:tabular-nums;
}
.note{margin:16px 0 0; font-size:12.5px; color:var(--ink-3)}

/* ── the night ────────────────────────────────────────────
   Two charts, never one with two axes. NLL and a per-decision rate are different
   measures on different scales, and putting them on one pair of axes invites the
   reader to compare slopes that have nothing to do with each other -- which is the
   whole point here, since the two disagree. */
.charts{margin-top:22px; display:flex; flex-direction:column; gap:18px}
.chart{background:var(--surface); border:1px solid var(--line); border-radius:6px;
       padding:14px 14px 10px}
.chart h2{margin:0 0 2px; font-size:13px; font-weight:600; letter-spacing:.01em}
.chart p{margin:0 0 10px; font-size:11.5px; color:var(--ink-3); line-height:1.5}
.chart canvas{display:block; width:100%; height:auto}
.keys{display:flex; flex-wrap:wrap; gap:14px; margin-top:8px;
      font-size:11.5px; color:var(--ink-2)}
.keys b{display:inline-block; width:20px; height:2px; vertical-align:middle;
        margin-right:6px; border-radius:1px}
.keys span{font-family:"IBM Plex Mono",ui-monospace,monospace;
           font-variant-numeric:tabular-nums; color:var(--ink-3)}
</style>

<div class="wrap">
  <div class="top">
    <span class="badge" id="badge" data-state="off">연결 안 됨</span>
    <span class="clock" id="clock">—</span>
    <span class="spacer"></span>
    <span class="who" id="who"></span>
  </div>

  <canvas id="map" width="760" height="760" role="img"
          aria-label="마을 지도와 사람들의 현재 위치"></canvas>
  <div class="legend" id="legend"></div>
  <div class="cast" id="cast"></div>
  <p class="note" id="note"></p>

  <div class="charts">
    <section class="chart">
      <h2>밤마다 재는 세 가지 — 프로브 NLL</h2>
      <p>낮을수록 잘 안다. <b>정체성</b>은 이 사람이 누구인가, <b>사실</b>은 마을에서
         실제로 있었던 일, <b>일반</b>은 마을과 무관한 능력.</p>
      <canvas id="nll" width="720" height="200" role="img"
              aria-label="밤에 따른 프로브 세 종의 NLL 곡선"></canvas>
      <div class="keys" id="nllkeys"></div>
    </section>

    <section class="chart">
      <h2>마을이 실제로 하는 일 — 건축가가 강을 건널 다리를 놓는가</h2>
      <p>건축가의 결정 중 봉인을 여는 강 칸에 다리를 놓은 비율. 위 곡선이 좋아지는
         구간에서 이 값이 무너진 적이 있어서, 따로 잰다.</p>
      <canvas id="build" width="720" height="180" role="img"
              aria-label="밤에 따른 다리 건설 비율"></canvas>
      <div class="keys" id="buildkeys"></div>
    </section>
  </div>
</div>

<script>
/* The map arrives with the relay. This page used to keep its own copy of it, which went
   stale the moment the village grew: it was still drawing a 12x12 grid with 오두막 on it
   and no 시청 at all, while the research machine ran a 20x20 map with a river sealing the
   diner. One copy now, and it travels with the run. */
let D = null;                 /* {map,size,blocked,placeOf,terrainName,homes} */

/* Relay only. This page does not simulate anything: it plays back frames the research
   machine publishes while a session runs. The browser-side port of world/npc/policy that
   used to live here is gone, and with it the risk of the two drifting apart.

   A session's public address arrives in live.json as config.stream; /village next to it
   carries a rolling window of the last ten seconds. Sixty frames per request rather than
   one current frame, because at six steps a second a once-a-second poll would show the
   NPCs teleporting. */
/* One colour per map character. Homes are digits, so they share a token. */
const TERRAIN = {"~":"--t-water","^":"--t-rock","#":"--t-rock",".":"--t-void",
                 "H":"--t-hill","R":"--t-river","Q":"--t-square","B":"--t-forge",
                 "F":"--t-diner","C":"--t-hall","U":"--t-home"};
for (const d of "123456") TERRAIN[d] = "--t-home";
const tokenOf = ch => TERRAIN[ch] || "--t-void";

/* Built things override terrain, exactly as world.passable does: a wall blocks, a road
   carries over anything -- which is what makes a road on the river a bridge. */
const key = (r,c) => r + "," + c;
/* cell -> 도로 · 다리 · 터널 · 벽. One per cell, because nothing can be built where
   something already stands -- clearing it is what 철거 is for. */
let BUILT = new Map();
const CROSSES = new Set(["도로", "다리", "터널"]);
const BUILT_TOKEN = {"도로":"--t-road", "다리":"--t-bridge",
                     "터널":"--t-tunnel", "벽":"--t-wall"};
const size = () => (D ? D.size : 0);
/* tileAt, not at -- draw() already has a local `at` for the current frame. */
const tileAt = (r,c) => (D && r>=0 && r<D.size && c>=0 && c<D.size) ? D.map[r][c] : null;
const passable = (r,c) => {
  const ch = tileAt(r,c);
  const what = BUILT.get(key(r,c));
  if (ch === null || what === "벽") return false;
  if (CROSSES.has(what)) return true;
  return !D.blocked.includes(ch);
};
const placeAt = (r,c) => { const ch = tileAt(r,c); return ch === null ? null
                           : (D.placeOf[ch] ?? null); };

const $ = id => document.getElementById(id);
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

const TOKENS = ["--paper","--line","--accent","--ink","--ink-2","--ink-3","--crit","--warn",
                "--ok","--surface","--t-water","--t-rock","--t-void","--t-hill","--t-home",
                "--t-river","--t-square","--t-forge","--t-diner","--t-hall",
                "--t-road","--t-wall","--t-bridge","--t-tunnel",
                "--s1","--s2","--s3"];
let PAL = {};
function readPalette(){
  const cs = getComputedStyle(document.documentElement);
  for (const t of TOKENS) PAL[t] = cs.getPropertyValue(t).trim();
}
const css = v => PAL[v] || "";

/* The legend is built from the map that arrived, so a new place shows up by itself. */
const LEGEND_ORDER = ["식당","시청","광장","대장간","언덕","강가"];
function drawLegend(){
  if (!D){ $("legend").innerHTML = ""; return; }
  const seen = new Map();
  for (const row of D.map) for (const ch of row){
    const p = D.placeOf[ch];
    if (p && !seen.has(p)) seen.set(p, tokenOf(ch));
  }
  const homes = [...seen.keys()].filter(p => p.startsWith("집"));
  for (const h of homes) seen.delete(h);
  const rows = [];
  for (const p of LEGEND_ORDER) if (seen.has(p)) rows.push([seen.get(p), p]);
  for (const [p, t] of seen) if (!LEGEND_ORDER.includes(p)) rows.push([t, p]);
  if (homes.length) rows.push(["--t-home", `집 ${homes.length}채`]);
  rows.push(["--t-water","강"], ["--t-rock","산"]);
  const tally = new Map();
  for (const kind of BUILT.values()) tally.set(kind, (tally.get(kind) || 0) + 1);
  for (const [kind, n] of tally) rows.push([BUILT_TOKEN[kind] || "--t-road", `${kind} ${n}`]);
  $("legend").innerHTML = rows
    .map(([v,n]) => `<span><i style="background:var(${v})"></i>${n}</span>`).join("");
}

/* ── playback ─────────────────────────────────────────
   Held deliberately behind the newest frame. Playing the newest one the instant it lands
   would stutter on every late request; running ~2s back turns network jitter into buffer
   the viewer never sees. Falling more than a window behind jumps forward rather than
   crawling, because this is a live relay and old frames are not worth catching up on. */
const LAG = 12;            // steps of deliberate delay: 2 s at 6 steps/s
const JUMP = 40;           // further behind than this and we skip forward instead

const PLAY = {frames: [], head: null, rate: 6, cast: [], now: null,
              starving: false, lastDraw: 0};

function ingest(payload){
  /* The map and what has been built arrive with the frames. A page that kept its own copy
     drew the village it was written against; this one draws the village that is running. */
  if (payload.world && payload.world.map){
    const fresh = !D || D.size !== payload.world.size
                     || D.map.join("|") !== payload.world.map.join("|");
    D = payload.world;
    if (fresh) drawLegend();
  }
  if (payload.built){
    const before = [...BUILT.entries()].map(([k,v]) => k+v).sort().join();
    BUILT = new Map((payload.built || []).map(([r,c,kind]) => [key(r,c), kind]));
    const now = [...BUILT.entries()].map(([k,v]) => k+v).sort().join();
    if (before !== now) drawLegend();
  }
  PLAY.rate = payload.rate || 6;
  PLAY.cast = payload.cast || [];
  PLAY.now = payload.now || null;
  const known = PLAY.frames.length ? PLAY.frames[PLAY.frames.length - 1].t : -1;
  for (const f of payload.window || []){
    if (f.t > known) PLAY.frames.push(f);
  }
  while (PLAY.frames.length > 400) PLAY.frames.shift();
  if (!PLAY.frames.length) return;
  const newest = PLAY.frames[PLAY.frames.length - 1].t;
  if (PLAY.head === null || newest - PLAY.head > JUMP) PLAY.head = Math.max(0, newest - LAG);
}

function frameAt(t){
  const f = PLAY.frames;
  if (!f.length) return null;
  if (t <= f[0].t) return {a: f[0], b: f[0], k: 0};
  for (let i = f.length - 1; i >= 0; i--){
    if (f[i].t <= t){
      const a = f[i], b = f[Math.min(i + 1, f.length - 1)];
      const span = b.t - a.t;
      return {a, b, k: span > 0 ? Math.min(1, (t - a.t) / span) : 0};
    }
  }
  return {a: f[0], b: f[0], k: 0};
}

/* ── drawing ──────────────────────────────────────────── */
function draw(){
  readPalette();
  const cv = $("map"), dpr = Math.min(devicePixelRatio || 1, 2);
  const box = cv.clientWidth || 760;
  if (cv.width !== Math.round(box * dpr)){
    cv.width = Math.round(box * dpr);
    cv.height = Math.round(box * dpr);
  }
  const g = cv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const N = size();
  if (!N) return;
  const S = box / N;
  g.clearRect(0, 0, box, box);

  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++){
    const what = BUILT.get(key(r,c));
    g.fillStyle = css(what ? (BUILT_TOKEN[what] || "--t-road") : tokenOf(D.map[r][c]));
    g.fillRect(c*S, r*S, S, S);
  }
  g.strokeStyle = css("--line"); g.globalAlpha = .45; g.lineWidth = 1;
  for (let i = 1; i < N; i++){
    g.beginPath(); g.moveTo(i*S, 0); g.lineTo(i*S, box); g.stroke();
    g.beginPath(); g.moveTo(0, i*S); g.lineTo(box, i*S); g.stroke();
  }
  g.globalAlpha = 1;

  g.font = `500 ${Math.max(9, S * 0.24)}px "IBM Plex Sans KR", sans-serif`;
  g.textAlign = "center"; g.textBaseline = "middle";
  const drawn = new Set();
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++){
    const p = placeAt(r, c);
    if (!p || drawn.has(p)) continue;
    drawn.add(p);
    g.fillStyle = "rgba(255,255,255,.9)";
    g.fillText(p, c*S + S/2, r*S + S/2);
  }

  const at = frameAt(PLAY.head === null ? -1 : PLAY.head);
  if (!at) return;

  /* trail: where each of them has been over the last two seconds */
  const tail = PLAY.frames.filter(f => f.t <= at.a.t && f.t > at.a.t - 12);
  g.fillStyle = css("--accent");
  tail.forEach((f, i) => {
    g.globalAlpha = (i + 1) / tail.length * 0.22;
    for (const [r, c] of f.pos){
      g.beginPath(); g.arc(c*S + S/2, r*S + S/2, S*0.1, 0, 7); g.fill();
    }
  });
  g.globalAlpha = 1;

  /* Group by cell before drawing. Cells are shareable and everyone heading to the same
     place is the normal case, so drawing one marker per person hides all but the last one
     -- and two people standing together is exactly what this relay exists to show. */
  const ease = reduced ? 1 : at.k;
  const spots = new Map();
  at.a.pos.forEach((pa, i) => {
    const pb = at.b.pos[i] || pa;
    const y = pa[0] + (pb[0] - pa[0]) * ease;
    const x = pa[1] + (pb[1] - pa[1]) * ease;
    const key = `${Math.round(y)},${Math.round(x)}`;
    if (!spots.has(key)) spots.set(key, {x, y, who: [], player: false});
    const spot = spots.get(key);
    spot.who.push(i);
    spot.player = spot.player || !!(PLAY.cast[i] || {}).player;
  });
  for (const spot of spots.values()){
    const px = spot.x * S + S/2, py = spot.y * S + S/2;
    const mark = spot.who.length === 1
      ? ((PLAY.cast[spot.who[0]] || {name: "?"}).name)[0]
      : String(spot.who.length);
    g.fillStyle = spot.player ? css("--crit") : css("--accent");
    g.beginPath(); g.arc(px, py, S*0.31, 0, 7); g.fill();
    g.strokeStyle = css("--paper"); g.lineWidth = 2.5;
    g.beginPath(); g.arc(px, py, S*0.31, 0, 7); g.stroke();
    g.fillStyle = css("--paper");
    g.font = `600 ${Math.max(9, S*0.29)}px "IBM Plex Sans KR", sans-serif`;
    g.fillText(mark, px, py + S*0.01);
  }
}

function renderCast(){
  const now = PLAY.now;
  if (!now || !now.agents){ $("cast").innerHTML = ""; return; }
  const band = v => v < 0.4 ? "--ok" : v < 0.7 ? "--warn" : "--crit";
  $("cast").innerHTML = now.agents.map((a, i) => {
    const who = PLAY.cast[i] || {};
    return `<div><b class="${who.player ? "me" : ""}">${a.name}`
      + (who.job ? ` <em>${who.job}</em>` : "")
      + `</b><em>${a.goal} → ${a.place}</em>`
      + `<s style="color:var(${band(a.worst)})">최악 ${a.worst.toFixed(2)}</s></div>`;
  }).join("");
}

function setBadge(state, text){
  $("badge").dataset.state = state;
  $("badge").textContent = text;
}

/* A tick is not an hour. It was when a day was 24 of them, and this printed the tick
   number with 시 after it; the day is 120 ticks now, so the page was showing 87시. The
   relay carries ticksPerDay and stepsPerTick, so the wall clock comes out of those and
   stays right whatever the day is worth. */
function wallClock(f){
  const ticks = D?.ticksPerDay ?? 24, steps = D?.stepsPerTick ?? 6;
  const minutes = (f.tick * steps + f.step) * (24 * 60) / (ticks * steps);
  const hh = String(Math.floor(minutes / 60)).padStart(2, "0");
  const mm = String(Math.floor(minutes % 60)).padStart(2, "0");
  return `${hh}:${mm}`;
}

function renderStatus(){
  const at = frameAt(PLAY.head === null ? -1 : PLAY.head);
  if (at){
    const f = at.a;
    $("clock").textContent = `${f.day}일 ${wallClock(f)}`;
    $("who").textContent = `${PLAY.cast.length}명 · ${PLAY.rate} 스텝/초`
      + (PLAY.starving ? " · 버퍼 대기" : "");
  } else {
    $("clock").textContent = "—";
    $("who").textContent = "";
  }
}

/* ── the feed ─────────────────────────────────────────── */
const PARAMS = new URLSearchParams(location.search);
const FIXED = PARAMS.get("src") || "";
const FEED = {base: FIXED, misses: 0, timer: null};

function baseOf(url){ return url.replace(/\/(state|village)\/?$/, ""); }

/* stream.json first. The address moves when a tunnel dies and gets replaced, and the
   snapshot cannot carry it: the trainer rewrites the snapshot every night from a config
   it captured when the session started, so a replacement written into it is gone by the
   next night -- the page went on pointing at a dead tunnel and getting HTTP 530.
   config.stream is still read as a fallback, so an older published record still names the
   session it came from. */
async function findSession(){
  try {
    const res = await fetch("stream.json?t=" + Date.now(), {cache: "no-store"});
    if (res.ok){
      const got = await res.json();
      if (got.stream) return got.stream;
      if (got.stream === null) return "";
    }
  } catch (err){ /* fall through to the snapshot */ }
  const res = await fetch("live.json?t=" + Date.now(), {cache: "no-store"});
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const snap = await res.json();
  return (snap.config || {}).stream || "";
}

async function pollOnce(){
  const res = await fetch(`${baseOf(FEED.base)}/village?t=${Date.now()}`, {cache: "no-store"});
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const payload = await res.json();
  if (payload.error || !(payload.window || []).length) throw new Error(payload.error || "empty");
  ingest(payload);
  renderCast();
  setBadge("live", "중계 중");
}

async function tick(){
  if (!document.hidden){
    try {
      if (!FEED.base) FEED.base = await findSession();
      if (!FEED.base){
        setBadge("off", "지금 도는 세션이 없다");
        $("note").textContent = "연구 PC 에서 세션을 켜면 여기에 마을이 중계된다.";
      } else {
        await pollOnce();
        FEED.misses = 0;
        $("note").textContent = "";
      }
    } catch (err) {
      if (++FEED.misses >= 2){
        setBadge(PLAY.frames.length ? "off" : "wait",
                 PLAY.frames.length ? "중계 끊김" : "세션 대기 중");
        $("note").textContent = PLAY.frames.length
          ? "세션이 끝났거나 연구 PC 가 꺼졌다. 마지막으로 받은 장면에 멈춰 있다."
          : "아직 받은 장면이 없다.";
        if (!FIXED) FEED.base = "";      /* re-read live.json: the address changes per session */
      }
    }
  }
  clearTimeout(FEED.timer);
  FEED.timer = setTimeout(tick, 1000);
}

/* ── the two curves ───────────────────────────────────────
   Both come from files the research machine publishes: live.json carries the nightly
   probes, build.json the construction measurement, which a third process on a second
   GPU writes without going through the relay at all. Both are copied to this origin,
   so the charts keep working with that machine off -- which is the point, since the
   tunnel is the flaky part. */
const NLL = [{key:"identity", name:"정체성", tok:"--s1"},
             {key:"fact",     name:"사실",   tok:"--s2"},
             {key:"general",  name:"일반",   tok:"--s3"}];

function fitCanvas(cv){
  const dpr = devicePixelRatio || 1;
  const w = cv.clientWidth || cv.width, h = Math.round(w * cv.height / cv.width);
  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)){
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    cv.style.height = h + "px";
  }
  const g = cv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  return {g, w, h};
}

/* Axes and grid, recessive on purpose: the marks carry the reading, not the frame. */
function axes(g, box, xmax, ymax, fmt){
  const {x0, y0, x1, y1} = box;
  g.font = '10px "IBM Plex Mono", ui-monospace, monospace';
  g.textBaseline = "middle";
  for (let i = 0; i <= 4; i++){
    const v = ymax * i / 4, y = y1 - (y1 - y0) * i / 4;
    g.strokeStyle = PAL["--line"]; g.lineWidth = 1;
    g.beginPath(); g.moveTo(x0, Math.round(y) + 0.5); g.lineTo(x1, Math.round(y) + 0.5); g.stroke();
    g.fillStyle = PAL["--ink-3"]; g.textAlign = "right";
    g.fillText(fmt(v), x0 - 6, y);
  }
  g.textAlign = "center"; g.textBaseline = "top";
  const step = Math.max(1, Math.ceil(xmax / 10));
  for (let d = 0; d <= xmax; d += step){
    const x = x0 + (x1 - x0) * (xmax ? d / xmax : 0);
    g.fillText(String(d), x, y1 + 6);
  }
}

function line(g, box, pts, xmax, ymax, colour, dash){
  if (!pts.length) return;
  const {x0, y0, x1, y1} = box;
  const px = d => x0 + (x1 - x0) * (xmax ? d / xmax : 0);
  const py = v => y1 - (y1 - y0) * Math.min(1, ymax ? v / ymax : 0);
  g.strokeStyle = colour; g.lineWidth = 2; g.lineJoin = "round";
  g.setLineDash(dash || []);
  g.beginPath();
  pts.forEach(([d, v], i) => (i ? g.lineTo(px(d), py(v)) : g.moveTo(px(d), py(v))));
  g.stroke();
  g.setLineDash([]);
  /* the newest point, ringed in the surface colour so it reads over a crossing line */
  const [d, v] = pts[pts.length - 1];
  g.fillStyle = colour;
  g.beginPath(); g.arc(px(d), py(v), 3.5, 0, 7); g.fill();
  g.strokeStyle = PAL["--surface"]; g.lineWidth = 2; g.stroke();
}

/* The swatch has to be dashed when its line is, or the key cannot be matched to the
   chart -- and dashing is the only thing separating the two reference lines from each
   other once they are both grey. */
function keyRow(el, items){
  el.innerHTML = items.map(([c, name, val, dash]) => {
    const fill = dash
      ? `background:repeating-linear-gradient(90deg,${c} 0 ${dash[0]}px,transparent ${dash[0]}px ${dash[0] + dash[1]}px)`
      : `background:${c}`;
    return `<span style="color:var(--ink-2)"><b style="${fill}"></b>${name}` +
           (val === undefined ? "" : ` <span>${val}</span>`) + `</span>`;
  }).join("");
}

function drawNLL(days){
  const cv = $("nll");
  if (!cv.clientWidth) return;
  const {g, w, h} = fitCanvas(cv);
  const box = {x0: 42, y0: 10, x1: w - 10, y1: h - 22};
  const series = NLL.map(sr => ({
    ...sr, pts: days.filter(d => typeof d[sr.key] === "number" && isFinite(d[sr.key]))
                     .map(d => [d.day, d[sr.key]])}));
  const ymax = Math.max(1, ...series.flatMap(sr => sr.pts.map(p => p[1]))) * 1.1;
  const xmax = Math.max(1, ...days.map(d => d.day));
  axes(g, box, xmax, ymax, v => v.toFixed(1));
  series.forEach(sr => line(g, box, sr.pts, xmax, ymax, PAL[sr.tok]));
  keyRow($("nllkeys"), series.map(sr => [PAL[sr.tok], sr.name,
    sr.pts.length ? sr.pts[sr.pts.length - 1][1].toFixed(2) : "—"]));
}

function drawBuild(state){
  const cv = $("build");
  if (!cv.clientWidth) return;
  const {g, w, h} = fitCanvas(cv);
  const box = {x0: 42, y0: 10, x1: w - 10, y1: h - 22};
  const pts = (state.points || []).map(p => [p.day, p.rate * 100]);
  const control = state.control ? state.control.rate * 100 : null;
  const base = state.base ? state.base.rate * 100 : null;
  const ymax = Math.max(2, ...pts.map(p => p[1]), control || 0, base || 0) * 1.25;
  const xmax = Math.max(1, ...pts.map(p => p[0]));
  axes(g, box, xmax, ymax, v => v.toFixed(1) + "%");
  /* the two references first, dashed, so the measured line reads on top of them */
  const flat = v => [[0, v], [xmax, v]];
  if (control !== null) line(g, box, flat(control), xmax, ymax, PAL["--ink-3"], [4, 4]);
  if (base !== null) line(g, box, flat(base), xmax, ymax, PAL["--ink-2"], [2, 3]);
  line(g, box, pts, xmax, ymax, PAL["--s1"]);
  const pc = v => v === null ? "—" : v.toFixed(1) + "%";
  keyRow($("buildkeys"), [
    [PAL["--s1"], "밤 학습", pts.length ? pc(pts[pts.length - 1][1]) : "아직 없음"],
    [PAL["--ink-2"], "베이스", pc(base), [2, 3]],
    [PAL["--ink-3"], "무작위", pc(control), [4, 4]]]);
}

const CURVES = {days: [], build: {control: null, base: null, points: []}};

async function pollCurves(){
  try {
    const res = await fetch("live.json?t=" + Date.now(), {cache: "no-store"});
    if (res.ok) CURVES.days = (await res.json()).days || [];
  } catch (err){ /* the page still has whatever it drew last */ }
  try {
    const res = await fetch("build.json?t=" + Date.now(), {cache: "no-store"});
    if (res.ok){
      const got = await res.json();
      if (!got.error) CURVES.build = got;
    }
  } catch (err){ /* likewise */ }
  drawCurves();
}

function drawCurves(){
  if (CURVES.days.length) drawNLL(CURVES.days);
  drawBuild(CURVES.build);
}

addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
addEventListener("resize", () => { draw(); drawCurves(); });

let last = 0;
function frame(ts){
  const dt = last ? (ts - last) / 1000 : 0;
  last = ts;
  if (PLAY.head !== null && PLAY.frames.length){
    const newest = PLAY.frames[PLAY.frames.length - 1].t;
    PLAY.head += dt * PLAY.rate;
    PLAY.starving = PLAY.head > newest;
    if (PLAY.starving) PLAY.head = newest;
  }
  draw();
  renderStatus();
  requestAnimationFrame(frame);
}

setBadge("wait", "연결 중");
draw();
tick();
/* The curves move once a night, not once a frame, so they get their own slow clock and
   are drawn from whatever the last poll left behind in between. */
pollCurves();
setInterval(pollCurves, 30000);
requestAnimationFrame(frame);
</script>
